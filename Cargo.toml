[package]
name = "pcap_processor"
version = "0.1.0"
edition = "2024"

[dependencies]
pcap = "2.4.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
tokio = { version = "1", features = ["full"] }
rayon = "1.8"
crossbeam = "0.8"                 
dashmap = "6.1.0"
chrono = "0.4"
csv = "1.3"
natord = "1.0"
rand = "0.8"
crossbeam-channel = "0.5"  # 用于 parser.rs 并行